---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ascender-galaxy-proxy-config
  namespace: ascender
data:
  # Enable debug logging.
  DEBUG: "false"
  # Cache API responses for this many days.
  QUERY_CACHE_EXPIRE: "1"
  # Cache artifact downloads for this many days.
  ARTIFACT_CACHE_EXPIRE: "30"
  # Comma-separated trusted proxy IPs.
  TRUSTED_PROXIES: ""
  # Public proxy URL used in rewritten links.
  URL: "https://galaxy-proxy.example.com"
  # Upstream Galaxy server to proxy requests to.
  UPSTREAM_BASEURL: "https://galaxy.ansible.com"
  # Clear the on-disk cache when the app starts.
  CLEAR_CACHE_ON_START: "0"
  # Max number of responses kept in memory.
  MEM_CACHE_SIZE: "2000"
  # Optional outbound HTTP proxy for upstream calls.
  HTTP_PROXY: ""
  # Token required for API authentication.
  GALAXY_API_TOKEN: ""
---
# If you prefer ephemeral cache storage, replace this PVC with emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ascender-galaxy-proxy-cache
  namespace: ascender
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascender-galaxy-proxy
  namespace: ascender
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ascender-galaxy-proxy
  template:
    metadata:
      labels:
        app: ascender-galaxy-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ascender-galaxy-proxy
          image: ghcr.io/ctrliq/ascender-galaxy-proxy:latest
          imagePullPolicy: Always
          args:
            - --port=80
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ascender-galaxy-proxy-config
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ascender-galaxy-proxy-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: ascender-galaxy-proxy-tls
  namespace: ascender
type: kubernetes.io/tls
data:
  tls.crt: ""    # BASE64 encoded string of certificate
  tls.key: ""    # BASE64 encoded string of private key
---
apiVersion: v1
kind: Service
metadata:
  name: ascender-galaxy-proxy
  namespace: ascender
spec:
  type: ClusterIP
  selector:
    app: ascender-galaxy-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ascender-galaxy-proxy
  namespace: ascender
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      - galaxy-proxy.example.com
      secretName: ascender-galaxy-proxy-tls
  rules:
    - host: galaxy-proxy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ascender-galaxy-proxy
                port:
                  number: 80
