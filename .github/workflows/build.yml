name: Build Containers on Push
env:
  LC_ALL: "C.UTF-8"

on:
  push:
    branches:
      - main
      - devel
      - feature_*

jobs:
  publish-containers:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:

      - name: Checkout Galaxy Proxy Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # checkout@v6.0.2

      - name: Setup Environment
        run: |
          echo "IMAGE_VERSION=${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # setup-buildx-action@v4.0.0

      - name: Build Galaxy Proxy Images
        run: |
          docker compose build

      - name: Push Galaxy Proxy Images
        run: |
          docker image tag ascender-galaxy-proxy:latest ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}

