name: Build Containers on Push
env:
  LC_ALL: "C.UTF-8"

on:
  push:
    branches:
      - main
      - devel
      - feature_*

jobs:
  publish-containers:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:

      - name: Checkout Galaxy Proxy Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Environment
        run: |
          echo "IMAGE_VERSION=${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build Galaxy Proxy Images
        run: |
          docker compose build

      - name: Push Galaxy Proxy Images
        run: |
          docker image tag ascender-galaxy-proxy:latest ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}

