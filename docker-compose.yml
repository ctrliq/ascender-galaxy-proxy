services:
  ascender-galaxy-proxy:
    image: ascender-galaxy-proxy:latest
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: ascender-galaxy-proxy
    ports:
      - "${EXTERNAL_PORT:-80}:80"
    environment:
      DEBUG: ${DEBUG:-false}
      QUERY_CACHE_EXPIRE: ${QUERY_CACHE_EXPIRE:-1}
      ARTIFACT_CACHE_EXPIRE: ${ARTIFACT_CACHE_EXPIRE:-30}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      GALAXY_API_TOKEN: ${GALAXY_API_TOKEN}
      URL: ${URL}
      UPSTREAM_BASEURL: ${UPSTREAM_BASEURL:-https://galaxy.ansible.com}
      CLEAR_CACHE_ON_START: ${CLEAR_CACHE_ON_START:-0}
      MEM_CACHE_SIZE: ${MEM_CACHE_SIZE:-2000}
      HTTP_PROXY: ${HTTP_PROXY}
    volumes:
      - ascender-galaxy-proxy-cache:/app/.cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  ascender-galaxy-proxy-cache:
    driver: local